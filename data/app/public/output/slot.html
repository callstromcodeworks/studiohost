<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg">
<title>Studio Host – Slot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: none; }
  #wrap.show { display: block; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; background: transparent; }
  #avatar { position: absolute; inset: 0; display: none; place-items: center; background: #14161A; }
  #avatar span { width: 36vh; height: 36vh; border-radius: 50%; display: grid; place-items: center; font: 500 14vh Roboto, system-ui, sans-serif; }
  #name { position: absolute; left: 2.5vh; bottom: 2.5vh; padding: .5em 1em; border-radius: 999px; font: 500 4.5vh Roboto, system-ui, sans-serif; display: none; }
  #name.two { border-radius: .85em; }
  #headline { font-size: .68em; font-weight: 400; opacity: .85; }
  #headline:empty { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline></video>
  <div id="avatar"><span id="initials"></span></div>
  <div id="name"><div id="name-text"></div><div id="headline"></div></div>
</div>
<script type="module" src="slot.js"></script>
</body>
</html>
